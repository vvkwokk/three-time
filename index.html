<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JS clock</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(67, 64, 68);

        }

        .container {
            width: 700px;
            height: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .second {
            height: 300px;
            width: 300px;
            border-radius: 50%;
            background-color: rgb(82, 209, 122);
            border: inset 8px rgb(224, 148, 241);
            transition: transform 2s linear;
        }

        .second-half {
            height: 150px;
            width: 300px;
            border-radius: 150px 150px 0 0;
            background-color: rgb(142, 72, 172);
        }

        .minute {
            height: 400px;
            width: 400px;
            border-radius: 50%;
            background-color: rgb(60, 55, 150);
            border: inset 8px rgb(206, 229, 54);
            transition: 2s;
        }

        .minute-half {
            height: 200px;
            width: 400px;
            border-radius: 200px 200px 0 0;
            background-color: rgb(230, 240, 45);
        }

        .hour {
            height: 500px;
            width: 500px;
            border-radius: 50%;
            background-color: rgb(181, 55, 116);
            border: inset 8px rgb(244, 104, 185);
            transition: 2s;
        }

        .hour-half {
            height: 250px;
            width: 500px;
            border-radius: 250px 250px 0 0;
            background-color: rgb(240, 185, 45);
        }

        .minute, .second {
            margin-left: -20%;
        }

        .minute:hover {
            background-color: rgb(187, 39, 39);
            transition: 0.6s;
        }

        .second:hover {
            background-color: rgb(238, 149, 41);
            transition: 0.6s;
        }

        .hour:hover {
            background-color: rgb(62, 167, 253);
            transition: 0.6s;
        }

        .hour-dot {
            height: 100px;
            width: 100px;
            border-radius: 50%;
            background-color: rgb(141, 255, 255);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .minute-dot {
            height: 70px;
            width: 70px;
            border-radius: 50%;
            background-color: rgb(206, 110, 125);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

        }.second-dot {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            background-color: rgb(206, 198, 110);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

    </style>

</head>

<body>
    <div class="container">
        <div class="hour">
            <div class="hour-half"></div>
            <div class="hour-dot"></div>
        </div>
        <div class="minute">
            <div class="minute-half"></div>
            <div class="minute-dot"></div>
        </div>
        <div class="second">
            <div class="second-half"></div>
            <div class="second-dot"></div>
        </div>

        <script>
            const secondHand = document.querySelector(".second");
            const hourHand = document.querySelector(".hour");
            const minuteHand = document.querySelector(".minute");

            function tick() {
                const seconds = new Date().getSeconds(); // 0–59
                secondHand.style.transform = `rotate(${seconds * 6}deg)`;

                const hours = new Date().getHours();
                hourHand.style.transform = `rotate(${hours * 30}deg)`;

                const minutes = new Date().getMinutes();
                minuteHand.style.transform = `rotate(${minutes * 6}deg)`;
            }

            tick();
            setInterval(tick, 1000);
        </script>
</body>

</html>
